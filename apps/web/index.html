<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/branding/favicon.svg" />
    <!-- Written at publish time next to the built bundle
         (scripts/lib/site-manifest.cjs, M7 issue 5); absent from a local
         dev server or a build that never ran the publisher. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Event-neutral shell title; EventConfigProvider sets document.title
         from the generated snapshot before first paint (spec §2.4). The SEO
         pass (M2, later tranche) owns the OG/meta tags. -->
    <title>Event site</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
