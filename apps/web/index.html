<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/branding/favicon.svg" />
    <!-- apps/web/public/manifest.webmanifest ships a neutral fallback so
         this resolves under a non-root base (Vite rewrites a root-relative
         href against `base` for any file it finds in publicDir, same as
         the favicon above) and so a hand deploy that never runs
         scripts/publish-site.cjs serves real JSON here rather than the
         SPA shell (Firebase Hosting serves a matching static file before
         it falls through to the `**` rewrite). The publisher overwrites
         this file with the event's own manifest at publish time
         (scripts/lib/site-manifest.cjs, M7 issue 5). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Event-neutral shell title; EventConfigProvider sets document.title
         from the generated snapshot before first paint (spec §2.4). The SEO
         pass (M2, later tranche) owns the OG/meta tags. -->
    <title>Event site</title>
  </head>
  <body>
    <div id="root">
      <div id="app-boot">
        <style>
          #app-boot { position: fixed; inset: 0; box-sizing: border-box; padding: 24px; color-scheme: light dark; color: CanvasText; background: Canvas; font: 16px/1.5 system-ui, sans-serif; }
          #app-boot p { max-width: 36em; margin: 0 0 16px; }
          #app-boot button { color: inherit; background: transparent; border: 1px solid; padding: 6px 12px; font: inherit; cursor: pointer; }
        </style>
        <p role="status" aria-live="polite" aria-atomic="true"></p>
        <button type="button" hidden>Reload this page</button>
        <script>
          (() => {
            const root = document.getElementById('root');
            const boot = document.getElementById('app-boot');
            const status = boot.querySelector('[role="status"]');
            const reload = boot.querySelector('button');
            const update = () => {
              const elapsed = performance.now();
              status.textContent = elapsed >= 10000
                ? 'This site is taking longer than usual to open. You can keep waiting or reload this page.'
                : elapsed >= 1000 ? 'Opening this site…' : '';
              reload.hidden = elapsed < 10000;
            };
            update();
            const timers = [1000, 10000].filter((at) => at > performance.now())
              .map((at) => setTimeout(update, Math.max(0, Math.ceil(at - performance.now()))));
            reload.addEventListener('click', () => location.reload());
            const observer = new MutationObserver(() => {
              if (!boot.isConnected) {
                timers.forEach(clearTimeout);
                observer.disconnect();
              }
            });
            observer.observe(root, { childList: true });
          })();
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
