<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- A bird track for the 1.25em section slot. It is intentionally spare:
       three toes, one heel, and a registration dot. At 20px every stroke is
       0.64px, so the mark stays crisp instead of dissolving into hatching. -->
  <path d="M50 50 L50 18"/>
  <path d="M50 50 L23 31"/>
  <path d="M50 50 L77 31"/>
  <path d="M50 50 L50 78"/>
  <path d="M50 78 C43 84 38 88 32 90 M50 78 C57 84 62 88 68 90"/>
  <circle cx="50" cy="50" r="4.5" fill="currentColor" stroke="none"/>
</svg>
