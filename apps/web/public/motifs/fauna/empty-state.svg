<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 30 200 84" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <!-- A field drawing: one closed outline for the animal, then the three marks
       that make the front of it a head rather than a snout on a bag — the ear
       standing on the crown, the cheek line behind it, and the eye set inside
       the skull. The outline runs nose, muzzle, brow, crown, nape, withers,
       back, rump, haunch, belly, chest, throat, jaw, and closes at the nose.

       Every stroke in this file is at least 0.6 units wide. The slot renders
       the drawing 128px tall, which is 1.5px to the unit, so the thinnest line
       here lands near a whole pixel and none of it greys out. -->
  <path d="M23,66
           C25.5,62 29,58 34,55
           C40,51.5 46,49.5 52.5,49.5
           C56,49.5 59,51 62,53.5
           C68,50.5 76,47.5 85,47.5
           C97,47.5 108,53 116,63
           C123,72 124,83 118,90
           C111,97 98,100 84,98.5
           C72,96.5 62,91 55,83
           C51,78 47,74.5 41,72.5
           C34,70.5 27,69 23,66 Z"/>

  <!-- The ear. Both ends land on the crown line, so it stands on the skull
       rather than floating beside it. One fold inside, which is all an ear at
       this size will hold. -->
  <path d="M49,49.8 C46,42 48.5,34.5 55,33.5 C61.5,32.5 66,38 65,45
           C64.5,48 63,50 60.5,51.2" stroke-width="0.8"/>
  <path d="M52.5,48 C51,42.5 52.5,38.5 56,37" stroke-width="0.6"/>

  <!-- The cheek: the one stroke that tells the skull from the shoulder. -->
  <path d="M60,55.5 C58,63 55,70 50,76" stroke-width="0.7"/>

  <!-- The eye, inside the skull and under the brow. -->
  <circle cx="39" cy="58" r="1.5" fill="currentColor" stroke="none"/>

  <!-- Whiskers. -->
  <g stroke-width="0.6">
    <path d="M22,64 L12,59.5"/>
    <path d="M21.5,66.3 L11,64.5"/>
    <path d="M22,68.5 L12.5,71.5"/>
  </g>

  <!-- The thigh inside the rump, and the two legs that carry the animal. -->
  <g stroke-width="0.7">
    <path d="M98,64 C109,66.5 116,75 113,86"/>
    <path d="M64,91.5 C62.5,96 62,100.5 62.5,104.2"/>
    <path d="M62.5,104.2 L57,104.8"/>
    <path d="M104,97.5 C102.5,100.5 101.5,102.5 102,104.2"/>
    <path d="M102,104.2 L94.5,104.8"/>
  </g>

  <!-- The tail, two lines closing to a point. -->
  <g stroke-width="0.7">
    <path d="M120,77 C144,76 172,77 205,81"/>
    <path d="M117,83 C142,82.5 170,81.5 205,81"/>
  </g>

  <!-- Coat direction: a few strokes laid inside the contour, along the
       shoulder and over the haunch. Not an even comb — the point is which way
       the fur runs, and that changes across the body. -->
  <g stroke-width="0.6">
    <path d="M72,54 L67.5,57.5"/>
    <path d="M83,51.5 L79,55"/>
    <path d="M95,53 L91.5,56"/>
    <path d="M101,73 L96.5,77.5"/>
    <path d="M104,81.5 L100.5,85"/>
  </g>

  <!-- The ruler the specimen is measured against. The animal stands clear of
       it: a scale bar under a drawing is not the ground it walks on. -->
  <path d="M14,106 L208,106" stroke-width="0.7"/>
  <g stroke-width="0.6">
    <path d="M20,106 L20,111"/>
    <path d="M30,106 L30,109"/>
    <path d="M40,106 L40,109"/>
    <path d="M50,106 L50,109"/>
    <path d="M60,106 L60,109"/>
    <path d="M70,106 L70,111"/>
    <path d="M80,106 L80,109"/>
    <path d="M90,106 L90,109"/>
    <path d="M100,106 L100,109"/>
    <path d="M110,106 L110,109"/>
    <path d="M120,106 L120,111"/>
    <path d="M130,106 L130,109"/>
    <path d="M140,106 L140,109"/>
    <path d="M150,106 L150,109"/>
    <path d="M160,106 L160,109"/>
    <path d="M170,106 L170,111"/>
    <path d="M180,106 L180,109"/>
    <path d="M190,106 L190,109"/>
    <path d="M200,106 L200,109"/>
  </g>
</svg>
