<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Harborlight illustrative venue plan</title>
  <desc id="desc">Two floors connected by a lift. The ground floor holds the main hall, registration, and a quiet room. The first floor holds rooms A and B. This is a fictional layout, not the Newark Museum of Art floor plan.</desc>
  <rect width="1000" height="700" fill="#f6f7f9"/>
  <g font-family="Arial, sans-serif" fill="#16181d">
    <text x="40" y="42" font-size="25" font-weight="700">Harborlight venue plan</text>
    <text x="40" y="67" font-size="15" fill="#585f6c">Illustrative layout. Not a surveyed museum plan.</text>
    <text x="40" y="106" font-size="18" font-weight="700">Ground floor</text>
    <g stroke="#585f6c" stroke-width="2">
      <rect x="40" y="120" width="260" height="160" rx="4" fill="#eceef2"/>
      <rect x="330" y="120" width="450" height="160" rx="4" fill="#e9edf3"/>
      <rect x="810" y="120" width="150" height="160" rx="4" fill="#eaf1ed"/>
      <rect x="40" y="300" width="820" height="44" rx="4" fill="#fff"/>
      <rect x="880" y="300" width="80" height="44" rx="4" fill="#eceef2"/>
    </g>
    <text x="64" y="152" font-size="19" font-weight="700">Registration</text>
    <text x="64" y="180" font-size="15">Badges and help desk</text>
    <text x="64" y="246" font-size="15">Entrance below</text>
    <path d="M170 295v-25m-7 8 7-8 7 8" fill="none" stroke="#b21e32" stroke-width="3"/>
    <text x="355" y="151" font-size="21" font-weight="700">Main hall</text>
    <text x="355" y="253" font-size="15">Shared sessions, meals, and the survey clinic</text>
    <text x="827" y="152" font-size="19" font-weight="700">Quiet room</text>
    <text x="827" y="179" font-size="14">Low-noise space</text>
    <text x="60" y="328" font-size="15">Gallery and water station</text>
    <text x="901" y="328" font-size="16" font-weight="700">Lift</text>
    <path d="M920 353v68m-7-10 7 10 7-10m-14-48 7-10 7 10" fill="none" stroke="#585f6c" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="40" y="410" font-size="18" font-weight="700">First floor</text>
    <g stroke="#585f6c" stroke-width="2">
      <rect x="40" y="435" width="380" height="180" rx="4" fill="#e9edf3"/>
      <rect x="450" y="435" width="410" height="180" rx="4" fill="#f4e9eb"/>
      <rect x="880" y="435" width="80" height="44" rx="4" fill="#eceef2"/>
      <rect x="40" y="632" width="920" height="20" rx="4" fill="#fff"/>
    </g>
    <text x="64" y="473" font-size="21" font-weight="700">Room A</text>
    <text x="64" y="500" font-size="15">Workshop tables</text>
    <text x="474" y="473" font-size="21" font-weight="700">Room B</text>
    <text x="474" y="500" font-size="15">Workshop tables</text>
    <text x="901" y="463" font-size="16" font-weight="700">Lift</text>
    <text x="40" y="683" font-size="14" fill="#585f6c">Room markers open location details. Room positions and walking times are fictional.</text>
  </g>
</svg>
