<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Placeholder floor plan">
  <!-- Neutral placeholder floor plan: an outline, a corridor, and four
       rooms off it. It names no building and carries no words, because the
       room names belong to the list beside the map and the numbers belong
       to the operator's own markers. Strokes read currentColor so the plan
       takes the ink of whatever it is drawn on; served through <img> that
       resolves to the color set below, in grayscale rgb() only, the same
       rule the other branding placeholders follow. -->
  <style>
    svg { color: rgb(91 93 97); }
    .fill { fill: rgb(240 240 238); }
    @media (prefers-color-scheme: dark) {
      svg { color: rgb(176 178 182); }
      .fill { fill: rgb(31 32 34); }
    }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
    <rect class="fill" x="12" y="12" width="376" height="276"/>
    <!-- The corridor, running the width of the plan. -->
    <path d="M12 150h376M12 186h376"/>
    <!-- Two rooms above it, two below, with doorways onto the corridor. -->
    <path d="M150 12v138M266 12v138"/>
    <path d="M126 186v102M254 186v102"/>
    <path d="M12 60h32M388 96h-32"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 6">
    <!-- The stair, drawn as treads rather than named. -->
    <path d="M300 210h64M300 226h64M300 242h64M300 258h64"/>
  </g>
</svg>
