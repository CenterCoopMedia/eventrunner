name: Docs
description: Something in the README, wiki, or contributor guide is wrong or missing.
title: "[Docs] "
labels: ["type:docs"]
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Use this for the public handbook and contributor docs. How-to questions still belong in [Q&A](https://github.com/CenterCoopMedia/run-of-show/discussions/new?category=q-a).
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Wiki (attendee / staff / client handbook)
        - README
        - CONTRIBUTING or GOVERNANCE
        - SECURITY or SUPPORT
        - Spec or roadmap
        - I am not sure
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: Page or heading if you have one.
  - type: textarea
    id: what
    attributes:
      label: What should change
      description: What is wrong, missing, or hard to find. Who got stuck.
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Before you submit
      options:
        - label: I agree to the [Code of Conduct](https://github.com/CenterCoopMedia/run-of-show/blob/main/CODE_OF_CONDUCT.md).
          required: true
