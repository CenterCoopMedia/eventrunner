name: Docs
description: Something in the README, handbook, or contributor guide is wrong or missing.
title: "[Docs] "
labels: ["type:docs"]
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Use this for the [handbook](https://centercoopmedia.github.io/eventrunner/docs/handbook/) and contributor docs. How-to questions still belong in [Q&A](https://github.com/CenterCoopMedia/eventrunner/discussions/new?category=q-a).
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Handbook (attendee / staff / client handbook)
        - README
        - CONTRIBUTING or GOVERNANCE
        - SECURITY or SUPPORT
        - Spec or roadmap
        - I am not sure
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: Page or heading if you have one.
  - type: textarea
    id: what
    attributes:
      label: What should change
      description: What is wrong, missing, or hard to find. Who got stuck.
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Before you submit
      options:
        - label: I agree to the [Code of Conduct](https://centercoopmedia.github.io/eventrunner/docs/code-of-conduct/).
          required: true
