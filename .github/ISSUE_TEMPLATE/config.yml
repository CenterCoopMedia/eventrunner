    url: https://github.com/CenterCoopMedia/eventrunner/security/advisories/new
    about: Private disclosure only. Do not file a public issue.
  - name: Read the handbook
    url: https://centercoopmedia.github.io/eventrunner/docs/handbook/
    about: Attendee, staff, and client guides.
