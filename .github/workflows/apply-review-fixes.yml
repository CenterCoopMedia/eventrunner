name: Export CI review fix

on:
  push:
    branches:
      - agent/plain-language-copy

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/plain-language-copy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the CI workflow edit
        run: node scripts/dev/apply-review-fixes.cjs
      - name: Upload the modified workflow
        uses: actions/upload-artifact@v4
        with:
          name: ci-with-copy-check
          path: .github/workflows/ci.yml
          if-no-files-found: error
