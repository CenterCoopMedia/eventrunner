name: Decommission one application

on:
  workflow_call:
    inputs:
      application_id:
        required: true
        type: string
      mode:
        required: false
        type: string
        default: ''
      confirm_site:
        required: false
        type: string
        default: ''
      event_name:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22.23.5'

jobs:
  remove-auto-deploy:
    if: inputs.event_name == 'schedule' || inputs.mode == 'archive' || inputs.mode == 'purge-now'
    uses: ./.github/workflows/auto-deploy-enrollment.yml
    with:
      application_id: ${{ inputs.application_id }}
      operation: ${{ inputs.event_name == 'schedule' && 'remove-due' || inputs.mode == 'archive' && 'archive' || 'remove' }}
      confirm_site: ${{ inputs.mode == 'purge-now' && inputs.confirm_site || '' }}
    secrets: inherit

  decommission:
    needs: remove-auto-deploy
    if: ${{ !cancelled() && (needs.remove-auto-deploy.result == 'success' || needs.remove-auto-deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: provisioning
    timeout-minutes: 330
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Prepare workspace dependencies
        run: |
          npm run prepare:functions
          node scripts/prepare-functions.cjs --copy
          npm ci
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Decommission the site
        env:
          APPLICATION_ID: ${{ inputs.application_id }}
          MODE: ${{ inputs.mode }}
          CONFIRM_SITE: ${{ inputs.confirm_site }}
          EVENT_NAME: ${{ inputs.event_name }}
          CONSOLE_PROJECT_ID: ${{ vars.CONSOLE_PROJECT_ID }}
          CONSOLE_CLIENT_ROUTE_MAP_BUCKET: ${{ vars.CONSOLE_CLIENT_ROUTE_MAP_BUCKET }}
          CONSOLE_PUBLIC_URL: ${{ vars.CONSOLE_PUBLIC_URL }}
          CONSOLE_MAIL_FROM: ${{ vars.CONSOLE_MAIL_FROM }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          PROVISIONER_APP_ID: ${{ vars.PROVISIONER_APP_ID }}
          PROVISIONER_INSTALLATION_ID: ${{ vars.PROVISIONER_INSTALLATION_ID }}
          CONSOLE_POSTMARK_TOKEN: ${{ secrets.CONSOLE_POSTMARK_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTMARK_ACCOUNT_TOKEN: ${{ secrets.POSTMARK_ACCOUNT_TOKEN }}
          PROVISIONER_APP_PRIVATE_KEY: ${{ secrets.PROVISIONER_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            node scripts/decommission-client.cjs --purge-due --application "$APPLICATION_ID"
          else
            case "$MODE" in
              archive) node scripts/decommission-client.cjs --application "$APPLICATION_ID" --archive ;;
              restore) node scripts/decommission-client.cjs --application "$APPLICATION_ID" --restore ;;
              cancel-restore) node scripts/decommission-client.cjs --application "$APPLICATION_ID" --cancel-restore ;;
              purge-now) node scripts/decommission-client.cjs --application "$APPLICATION_ID" --purge --now --confirm-site "$CONFIRM_SITE" ;;
              verify) node scripts/decommission-client.cjs --application "$APPLICATION_ID" --verify ;;
              *) echo '::error::The mode is not valid.' >&2; exit 1 ;;
            esac
          fi

  restore-auto-deploy:
    needs: decommission
    if: ${{ !cancelled() && inputs.mode == 'restore' && needs.decommission.result == 'success' }}
    uses: ./.github/workflows/auto-deploy-enrollment.yml
    with:
      application_id: ${{ inputs.application_id }}
      operation: restore
    secrets: inherit
