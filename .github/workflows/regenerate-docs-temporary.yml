name: Temporary documentation regeneration

on:
  push:
    branches:
      - agent/plain-language-copy

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate committed documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/plain-language-copy
          fetch-depth: 0
      - name: Rebuild the documentation site
        run: node scripts/build-pages.cjs
      - name: Commit regenerated output
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/docs docs/tokens.css; then
            echo "Documentation output is already current."
            exit 0
          fi
          git config user.name "Joe Amditis"
          git config user.email "6799804+jamditis@users.noreply.github.com"
          git add docs/docs docs/tokens.css
          git commit -m "chore: regenerate documentation pages" \
            -m "Rebuild the committed documentation site after the source copy changes." \
            -m "Signed-off-by: Joe Amditis <6799804+jamditis@users.noreply.github.com>"
          git push origin HEAD:agent/plain-language-copy
