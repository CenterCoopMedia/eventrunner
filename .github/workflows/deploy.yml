name: Repair PR 133

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codex/123-admin-test-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/123-admin-test-readiness
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Replace timing guesses with page-owned readiness
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          pump = """  await act(async () => {
            await Promise.resolve();
            await Promise.resolve();
          });
          """
          for path in [
              'apps/web/src/admin/pages/AdminPageEditor.test.jsx',
              'apps/web/src/admin/pages/AdminBranding.test.jsx',
              'apps/web/src/admin/pages/AdminContentBlockEditor.test.jsx',
              'apps/web/src/admin/pages/AdminSettings.test.jsx',
          ]:
              file = Path(path)
              text = file.read_text()
              if text.count(pump) != 1:
                  raise SystemExit(f'{path}: expected one fixed microtask pump')
              file.write_text(text.replace(pump, '', 1))

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          gate_tail = """    { timeout: 5000 },
            );
            return result;
          }
          """
          gate_with_heading = """    { timeout: 5000 },
            );
            await screen.findByRole('heading', { level: 1 });
            return result;
          }
          """
          for path in [
              'apps/web/src/admin/pages/AdminPageEditor.test.jsx',
              'apps/web/src/admin/pages/AdminContentBlockEditor.test.jsx',
          ]:
              replace_once(path, gate_tail, gate_with_heading)

          replace_once(
              'apps/web/src/admin/pages/AdminBranding.test.jsx',
              """  await act(async () => {
            configSubscriptions.get('theme')(themeDoc);
            await Promise.resolve();
          });
            return result;
          }
          """,
              """  await waitFor(() => expect(configSubscriptions.has('theme')).toBe(true));
            act(() => configSubscriptions.get('theme')(themeDoc));
            const expectedBrand = themeDoc.brandColor ?? themeDoc.colors?.primary;
            if (expectedBrand) {
              await waitFor(() =>
                expect(screen.getByLabelText('Main brand colour')).toHaveValue(expectedBrand),
              );
            }
            return result;
          }
          """,
          )

          replace_once(
              'apps/web/src/admin/pages/AdminSettings.test.jsx',
              """async function pushConfig(docId, data) {
            await act(async () => {
              configSubscriptions.get(docId)(data);
              await Promise.resolve();
            });
          }
          """,
              """async function pushConfig(docId, data) {
            await waitFor(() => expect(configSubscriptions.has(docId)).toBe(true));
            act(() => configSubscriptions.get(docId)(data));

            if (docId === 'event') {
              await waitFor(() => {
                if (data.name) expect(screen.getByLabelText('Event name')).toHaveValue(data.name);
                if (data.shortName) expect(screen.getByText(data.shortName)).toBeInTheDocument();
              });
              return;
            }
            if (docId === 'features') {
              const [flag] = Object.keys(data);
              if (flag) {
                await waitFor(() =>
                  data[flag]
                    ? expect(screen.getByLabelText(flag)).toBeChecked()
                    : expect(screen.getByLabelText(flag)).not.toBeChecked(),
                );
              }
              return;
            }
            if (docId === 'badges' && data.categories?.[0]?.label) {
              await waitFor(() =>
                expect(screen.getByLabelText('Category 1 label')).toHaveValue(
                  data.categories[0].label,
                ),
              );
            }
          }
          """,
          )

          for path in [
              'apps/web/src/admin/pages/AdminPageEditor.test.jsx',
              'apps/web/src/admin/pages/AdminContentBlockEditor.test.jsx',
          ]:
              file = Path(path)
              text = file.read_text()
              if 'act(' not in text:
                  text = text.replace(
                      'import { act, fireEvent, render, screen, waitFor, within }',
                      'import { fireEvent, render, screen, waitFor, within }',
                  ).replace(
                      'import { act, fireEvent, render, screen, waitFor }',
                      'import { fireEvent, render, screen, waitFor }',
                  )
              file.write_text(text)
          PY

      - name: Stress the affected tests
        shell: bash
        run: |
          npm run prepare:functions
          npm ci
          for pass in 1 2 3; do
            npm run test -w apps/web -- \
              src/admin/pages/AdminPageEditor.test.jsx \
              src/admin/pages/AdminBranding.test.jsx \
              src/admin/pages/AdminContentBlockEditor.test.jsx \
              src/admin/pages/AdminSettings.test.jsx
          done
          npm run test:web
          npm run test:web
          npm run lint

      - name: Restore workflows and commit the repaired tests
        shell: bash
        run: |
          git show origin/main:.github/workflows/deploy.yml > .github/workflows/deploy.yml
          git rm -f .github/workflows/patch-133-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "Wait for admin page data in tests"
          git push origin HEAD:codex/123-admin-test-readiness
