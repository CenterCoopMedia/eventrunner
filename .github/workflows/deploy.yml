name: Repair PR 134

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codex/124-keyboard-scroll-regions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/124-keyboard-scroll-regions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Implement keyboard-reachable scroll regions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          Path('apps/web/src/components/HorizontalScrollRegion.jsx').write_text(r'''import { useCallback, useLayoutEffect, useRef, useState } from 'react';

export function hasHorizontalOverflow(node) {
  return Boolean(node) && node.scrollWidth > node.clientWidth;
}

export default function HorizontalScrollRegion({
  label,
  className = '',
  children,
  ...props
}) {
  const regionRef = useRef(null);
  const [overflowing, setOverflowing] = useState(false);

  const measure = useCallback(() => {
    const next = hasHorizontalOverflow(regionRef.current);
    setOverflowing((current) => (current === next ? current : next));
  }, []);

  // Content can change without replacing this component. Measure after each
  // render, then keep the answer current as layout and descendants change.
  useLayoutEffect(() => {
    measure();
  });

  useLayoutEffect(() => {
    const node = regionRef.current;
    if (!node) return undefined;

    const ResizeObserverType = globalThis.ResizeObserver;
    const resizeObserver =
      typeof ResizeObserverType === 'function' ? new ResizeObserverType(measure) : null;
    const observeContent = () => {
      resizeObserver?.observe(node);
      if (node.firstElementChild) resizeObserver?.observe(node.firstElementChild);
    };
    observeContent();

    const MutationObserverType = globalThis.MutationObserver;
    const mutationObserver =
      typeof MutationObserverType === 'function'
        ? new MutationObserverType(() => {
            observeContent();
            measure();
          })
        : null;
    mutationObserver?.observe(node, {
      attributes: true,
      characterData: true,
      childList: true,
      subtree: true,
    });

    const view = typeof window === 'undefined' ? null : window;
    view?.addEventListener('resize', measure);
    return () => {
      resizeObserver?.disconnect();
      mutationObserver?.disconnect();
      view?.removeEventListener('resize', measure);
    };
  }, [measure]);

  return (
    <div
      {...props}
      ref={regionRef}
      className={['horizontal-scroll-region', className].filter(Boolean).join(' ')}
      data-scroll-label={label}
      tabIndex={overflowing ? 0 : undefined}
      role={overflowing ? 'region' : undefined}
      aria-label={overflowing ? label : undefined}
    >
      {children}
    </div>
  );
}
''')

          Path('apps/web/src/components/HorizontalScrollRegion.test.jsx').write_text(r'''import { act, render } from '@testing-library/react';
import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';
import HorizontalScrollRegion, { hasHorizontalOverflow } from './HorizontalScrollRegion.jsx';

let resizeObservers;
let mutationObservers;
let originalResizeObserver;
let originalMutationObserver;

class ResizeObserverDouble {
  constructor(callback) {
    this.callback = callback;
    this.observe = vi.fn();
    this.disconnect = vi.fn();
    resizeObservers.push(this);
  }
}

class MutationObserverDouble {
  constructor(callback) {
    this.callback = callback;
    this.observe = vi.fn();
    this.disconnect = vi.fn();
    mutationObservers.push(this);
  }
}

function setWidths(node, { client, scroll }) {
  Object.defineProperty(node, 'clientWidth', { configurable: true, value: client });
  Object.defineProperty(node, 'scrollWidth', { configurable: true, value: scroll });
}

beforeEach(() => {
  resizeObservers = [];
  mutationObservers = [];
  originalResizeObserver = globalThis.ResizeObserver;
  originalMutationObserver = globalThis.MutationObserver;
  globalThis.ResizeObserver = ResizeObserverDouble;
  globalThis.MutationObserver = MutationObserverDouble;
});

afterEach(() => {
  globalThis.ResizeObserver = originalResizeObserver;
  globalThis.MutationObserver = originalMutationObserver;
});

describe('HorizontalScrollRegion', () => {
  it('adds and removes region semantics as measured overflow changes', () => {
    const { container, unmount } = render(
      <HorizontalScrollRegion label="Day one schedule grid">
        <div>Programme</div>
      </HorizontalScrollRegion>,
    );
    const region = container.firstElementChild;
    setWidths(region, { client: 320, scroll: 320 });
    act(() => resizeObservers[0].callback([]));
    expect(region).not.toHaveAttribute('tabindex');
    expect(region).not.toHaveAttribute('role');
    expect(region).not.toHaveAttribute('aria-label');

    setWidths(region, { client: 320, scroll: 640 });
    act(() => resizeObservers[0].callback([]));
    expect(region).toHaveAttribute('tabindex', '0');
    expect(region).toHaveAttribute('role', 'region');
    expect(region).toHaveAccessibleName('Day one schedule grid');

    setWidths(region, { client: 640, scroll: 640 });
    act(() => mutationObservers[0].callback([]));
    expect(region).not.toHaveAttribute('tabindex');
    expect(region).not.toHaveAttribute('role');

    unmount();
    expect(resizeObservers[0].disconnect).toHaveBeenCalledOnce();
    expect(mutationObservers[0].disconnect).toHaveBeenCalledOnce();
  });

  it('uses the window resize fallback when ResizeObserver is unavailable', () => {
    globalThis.ResizeObserver = undefined;
    const { container } = render(
      <HorizontalScrollRegion label="Wide table">
        <table><tbody><tr><td>Value</td></tr></tbody></table>
      </HorizontalScrollRegion>,
    );
    const region = container.firstElementChild;
    setWidths(region, { client: 200, scroll: 400 });
    act(() => window.dispatchEvent(new Event('resize')));
    expect(region).toHaveAttribute('tabindex', '0');
    expect(region).toHaveAccessibleName('Wide table');
  });

  it('uses strict width comparison', () => {
    expect(hasHorizontalOverflow({ clientWidth: 200, scrollWidth: 200 })).toBe(false);
    expect(hasHorizontalOverflow({ clientWidth: 200, scrollWidth: 201 })).toBe(true);
  });
});
''')

