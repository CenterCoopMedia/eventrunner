name: Deploy client

# Reusable, workflow_call-only (spec §8.1): every job below declares
# `environment: ${{ inputs.client }}`, which resolves correctly for both the
# push-fanout and the workflow_dispatch caller because the value arrives as
# a workflow input, not as `inputs.client` read off the outer event.
#
# Auth is Workload Identity Federation (google-github-actions/auth) — no
# service-account key ever touches the runner or a secret store. Per client
# environment: `vars.WIF_PROVIDER`, `vars.WIF_SERVICE_ACCOUNT` (see
# docs/DEPLOY_RUNBOOK.md for the one-time GCP/GitHub setup).
#
# No `continue-on-error` anywhere in this file, on purpose (spec §8.1): the
# workflow this replaces carried it on the functions deploy step, which is
# how a Cloud Billing API 403 went unnoticed for weeks.

on:
  workflow_call:
    inputs:
      client:
        description: Client GitHub Environment name.
        required: true
        type: string
      provision:
        description: Also deploy firestore:rules, firestore:indexes, and storage (always true regardless — see the provision job).
        required: false
        type: boolean
        default: false
      bootstrap:
        description: Bootstrap mode — deploy only provision + functions, skipping content/build/hosting/smoke. Use for the very first deploy of a fresh project, before config/event exists (an operator runs scripts/init-event.cjs in between); see docs/DEPLOY_RUNBOOK.md §5.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for google-github-actions/auth (WIF)

concurrency:
  group: deploy-client-${{ inputs.client }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  guard:
    name: Guard fork execution
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on a forked repository
        run: |
          if [ "${{ github.event.repository.fork }}" = "true" ]; then
            echo "::error::Deploy workflows never run on a forked repository — client secrets are not available there and must not be requested." >&2
            exit 1
          fi
          echo "guard: not a fork — continuing"
      - name: Refuse to run outside refs/heads/main
        # Defense-in-depth ONLY. This step runs as code checked out from the
        # ref being deployed, so a commit on a non-main branch could edit or
        # delete it before the run ever reaches here — a check like this
        # cannot be the real boundary. The actual enforcement is the
        # Workload Identity Federation principalSet condition on the deploy
        # service account (docs/DEPLOY_RUNBOOK.md §1-2): it is evaluated by
        # Google's IAM against the OIDC token's `ref` claim, outside this
        # repository's control, and scoped to `attribute.repository_and_ref
        # == <org>/<repo>#refs/heads/main`, so a workflow_dispatch against
        # any other branch fails the token exchange regardless of what this
        # step does. This step exists only to fail fast, with a clear
        # message, before spending a job on a run that WIF would refuse
        # anyway — and to cover the (defense-in-depth) gap between "this
        # step was accidentally never wired up for a given ref" and the WIF
        # condition, which cannot be misconfigured per-run.
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deploys only run from refs/heads/main (got ${{ github.ref }}). This check is defense-in-depth only — see docs/DEPLOY_RUNBOOK.md §1-2 for the actual enforcement (a WIF principalSet condition scoped to this repository AND refs/heads/main)." >&2
            exit 1
          fi
          echo "guard: ref is refs/heads/main — continuing"

  changes:
    name: Detect functions-affecting changes
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            functions:
              - 'functions/**'
              - 'packages/shared/**'
              - 'package-lock.json'
              - 'firebase.json'
              - 'scripts/prepare-functions.cjs'
              - '.github/workflows/deploy-client.yml'

  shared:
    name: Pack shared workspace
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Pack packages/shared into functions/vendor/shared.tgz
        run: npm run prepare:functions
      - uses: actions/upload-artifact@v4
        with:
          # Namespaced by client: a push run can fan out to several clients
          # in one workflow run (deploy.yml's matrix), and v4 artifacts are
          # immutable and must be unique within a run — an unqualified name
          # here would collide on the second client's upload.
          name: shared-tgz-${{ inputs.client }}
          path: functions/vendor/shared.tgz
          retention-days: 1

  validate-env:
    name: Validate deploy-time environment
    needs: guard
    environment: ${{ inputs.client }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate Tier A environment (spec §2.1) before touching GCP
        # An unset GitHub Environment variable renders as an empty string
        # in this env: block, not as absent — validateDeployEnv is what
        # catches that and names the exact key, instead of the vars
        # reaching firebase deploy / vite build as silent blanks.
        env:
          EVENT_SLUG: ${{ vars.EVENT_SLUG }}
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
          EVENT_FIREBASE_REGION: ${{ vars.EVENT_FIREBASE_REGION }}
          EVENT_HOSTING_SITE: ${{ vars.EVENT_HOSTING_SITE }}
          EVENT_PUBLIC_URL: ${{ vars.EVENT_PUBLIC_URL }}
          EVENT_STORAGE_BUCKET: ${{ vars.EVENT_STORAGE_BUCKET }}
          EVENT_ALLOWED_ORIGINS: ${{ vars.EVENT_ALLOWED_ORIGINS }}
          EVENT_EMAIL_PROVIDER: ${{ vars.EVENT_EMAIL_PROVIDER }}
          EVENT_TICKETING_PROVIDER: ${{ vars.EVENT_TICKETING_PROVIDER }}
          EVENT_TICKETING_EVENT_ID: ${{ vars.EVENT_TICKETING_EVENT_ID }}
          EVENT_OPERATOR_NOTIFIER: ${{ vars.EVENT_OPERATOR_NOTIFIER }}
          # OTP abuse controls (§3.1). Both optional; validateDeployEnv
          # rejects a non-boolean flag, a non-positive ceiling, and
          # enforcement without a site key.
          EVENT_APP_CHECK_ENFORCED: ${{ vars.EVENT_APP_CHECK_ENFORCED }}
          EVENT_OTP_SEND_CEILING_PER_HOUR: ${{ vars.EVENT_OTP_SEND_CEILING_PER_HOUR }}
          # Site publisher (spec §8.4 phase 5). Both are deploy-time only.
          # validateDeployEnv rejects a non-boolean flag, and rejects
          # enabling the publisher without the service account it must run
          # as — an unset account would otherwise reach `gcloud run jobs
          # deploy` as a blank and take the project's default identity.
          EVENT_SITE_PUBLISHER_ENABLED: ${{ vars.EVENT_SITE_PUBLISHER_ENABLED }}
          EVENT_PUBLISHER_SERVICE_ACCOUNT: ${{ vars.EVENT_PUBLISHER_SERVICE_ACCOUNT }}
          EVENT_FUNCTIONS_SERVICE_ACCOUNT: ${{ vars.EVENT_FUNCTIONS_SERVICE_ACCOUNT }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_EVENT_PUBLIC_URL: ${{ vars.EVENT_PUBLIC_URL }}
        run: node scripts/validate-deploy-env.cjs

  provision:
    name: Provision Firestore rules/indexes and Storage rules
    needs: [guard, shared, validate-env]
    environment: ${{ inputs.client }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-tgz-${{ inputs.client }}
          path: functions/vendor
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Deploy Firestore rules, Firestore indexes, and Storage rules
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
        run: >-
          npx firebase deploy
          --only firestore:rules,firestore:indexes,storage
          --project "$EVENT_FIREBASE_PROJECT_ID"
          --non-interactive

  functions:
    name: Deploy functions
    needs: [guard, shared, validate-env, changes]
    # Dispatch always deploys functions — provisioning a fresh project needs
    # them and there is nothing yet to diff against. Push runs stay gated on
    # the paths filter so an unrelated change does not burn the deploy quota
    # (spec §8.1).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.functions == 'true'
    environment: ${{ inputs.client }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-tgz-${{ inputs.client }}
          path: functions/vendor
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Write the functions runtime env for this project
        # Cloud Functions v2 bakes in `functions/.env.<project-id>` at
        # deploy time (spec §2.1 Tier A). Secrets (EMAIL_PROVIDER_API_KEY
        # etc.) are never written here — they reach the function through
        # `defineSecret`/Secret Manager, provisioned once per environment
        # (docs/DEPLOY_RUNBOOK.md), not through this file.
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
          EVENT_SLUG: ${{ vars.EVENT_SLUG }}
          EVENT_FIREBASE_REGION: ${{ vars.EVENT_FIREBASE_REGION }}
          EVENT_PUBLIC_URL: ${{ vars.EVENT_PUBLIC_URL }}
          EVENT_STORAGE_BUCKET: ${{ vars.EVENT_STORAGE_BUCKET }}
          EVENT_ALLOWED_ORIGINS: ${{ vars.EVENT_ALLOWED_ORIGINS }}
          EVENT_EMAIL_PROVIDER: ${{ vars.EVENT_EMAIL_PROVIDER }}
          EVENT_TICKETING_PROVIDER: ${{ vars.EVENT_TICKETING_PROVIDER }}
          EVENT_TICKETING_EVENT_ID: ${{ vars.EVENT_TICKETING_EVENT_ID }}
          EVENT_OPERATOR_NOTIFIER: ${{ vars.EVENT_OPERATOR_NOTIFIER }}
          EVENT_APP_CHECK_ENFORCED: ${{ vars.EVENT_APP_CHECK_ENFORCED }}
          EVENT_OTP_SEND_CEILING_PER_HOUR: ${{ vars.EVENT_OTP_SEND_CEILING_PER_HOUR }}
          EVENT_SITE_PUBLISHER_ENABLED: ${{ vars.EVENT_SITE_PUBLISHER_ENABLED }}
        run: |
          set -euo pipefail
          {
            echo "EVENT_FIREBASE_PROJECT_ID=$EVENT_FIREBASE_PROJECT_ID"
            echo "EVENT_SLUG=$EVENT_SLUG"
            echo "EVENT_FIREBASE_REGION=${EVENT_FIREBASE_REGION:-us-central1}"
            echo "EVENT_PUBLIC_URL=$EVENT_PUBLIC_URL"
            echo "EVENT_STORAGE_BUCKET=$EVENT_STORAGE_BUCKET"
            echo "EVENT_ALLOWED_ORIGINS=$EVENT_ALLOWED_ORIGINS"
            echo "EVENT_EMAIL_PROVIDER=$EVENT_EMAIL_PROVIDER"
            echo "EVENT_TICKETING_PROVIDER=$EVENT_TICKETING_PROVIDER"
            echo "EVENT_TICKETING_EVENT_ID=$EVENT_TICKETING_EVENT_ID"
            echo "EVENT_OPERATOR_NOTIFIER=$EVENT_OPERATOR_NOTIFIER"
            # Read by auth/otp.cjs at deploy time (§3.1). Defaulted here so
            # an unset variable lands as the documented safe value rather
            # than a blank line the runtime has to reinterpret.
            echo "EVENT_APP_CHECK_ENFORCED=${EVENT_APP_CHECK_ENFORCED:-false}"
            echo "EVENT_OTP_SEND_CEILING_PER_HOUR=${EVENT_OTP_SEND_CEILING_PER_HOUR:-500}"
            # Presence-of-config gate for the site publisher (spec §8.4):
            # cms/publisher.cjs treats an unset EVENT_SITE_PUBLISHER_JOB as
            # "this deployment has no publisher" and skips cleanly. The key
            # is written ONLY for a client whose publisher job this workflow
            # actually creates, so a client without one never invokes a job
            # that does not exist. The value is the fixed job name — see
            # SITE_PUBLISHER_JOB_NAME in packages/shared/src/config/deploy.cjs
            # and the `publisher` job below.
            if [ "${EVENT_SITE_PUBLISHER_ENABLED:-false}" = "true" ]; then
              echo "EVENT_SITE_PUBLISHER_JOB=site-publisher"
            fi
          } > "functions/.env.${EVENT_FIREBASE_PROJECT_ID}"
      - name: Deploy functions
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
        run: >-
          npx firebase deploy
          --only functions
          --project "$EVENT_FIREBASE_PROJECT_ID"
          --non-interactive

  publisher:
    name: Provision the site-publisher Cloud Run job
    needs: [guard, shared, validate-env]
    # Off unless the client's Environment opts in. The job needs an
    # Artifact Registry repository, the Cloud Run and Artifact Registry
    # APIs, and a dedicated runtime service account, none of which exist
    # in a project that has not been through docs/DEPLOY_RUNBOOK.md §9 —
    # so an existing client deploys exactly as it did before phase 5.
    # Skipped on a bootstrap run for the same reason `content` is: a fresh
    # project has no config/event, so the job would have nothing to
    # snapshot on its first execution anyway.
    if: vars.EVENT_SITE_PUBLISHER_ENABLED == 'true' && inputs.bootstrap != true
    environment: ${{ inputs.client }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # publisher/Dockerfile runs `npm ci` over the whole workspace, and
          # functions/package.json depends on this tarball by path — without
          # it the install cannot resolve the tree.
          name: shared-tgz-${{ inputs.client }}
          path: functions/vendor
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Ensure the Artifact Registry repository exists
        # Per client, in the CLIENT'S OWN project. A shared operator
        # registry would put a read grant on one image path into every
        # client project and make each Cloud Run job pull across a project
        # boundary — §8.4 is explicit that the job runs "under the project's
        # own service account", and the image it pulls is part of that
        # boundary. describe-then-create rather than `create || true`, so a
        # genuine failure (no permission, API not enabled) still fails the
        # run instead of being swallowed by a shell fallback.
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
          EVENT_FIREBASE_REGION: ${{ vars.EVENT_FIREBASE_REGION }}
        run: |
          set -euo pipefail
          region="${EVENT_FIREBASE_REGION:-us-central1}"
          if gcloud artifacts repositories describe run-of-show \
              --location "$region" --project "$EVENT_FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
            echo "artifact registry: run-of-show already exists in $region"
          else
            gcloud artifacts repositories create run-of-show \
              --repository-format=docker \
              --location "$region" \
              --project "$EVENT_FIREBASE_PROJECT_ID" \
              --description="Run of Show site-publisher images"
          fi
      - name: Build and push the site-publisher image
        # Built on the runner and pushed straight to Artifact Registry
        # rather than through Cloud Build: the deploy service account then
        # needs artifactregistry.writer and nothing more, instead of the
        # Cloud Build service agent, a staging bucket, and the broader
        # permissions a Cloud Build submission carries.
        #
        # Tagged with the commit SHA, never a floating tag: the Cloud Run
        # job below pins that exact digest-bearing tag, so what a client's
        # publisher runs is always identifiable from the deploy that put it
        # there, and a rollback is a redeploy of the older commit.
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
          EVENT_FIREBASE_REGION: ${{ vars.EVENT_FIREBASE_REGION }}
        run: |
          set -euo pipefail
          region="${EVENT_FIREBASE_REGION:-us-central1}"
          image="${region}-docker.pkg.dev/${EVENT_FIREBASE_PROJECT_ID}/run-of-show/site-publisher:${GITHUB_SHA}"
          gcloud auth configure-docker "${region}-docker.pkg.dev" --quiet
          docker build -f publisher/Dockerfile -t "$image" .
          docker push "$image"
          echo "PUBLISHER_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Write the Cloud Run job environment
        # jq emits the env file rather than `--set-env-vars`, because
        # EVENT_ALLOWED_ORIGINS is comma-separated and gcloud's flag parser
        # splits on commas. --env-vars-file takes YAML, and JSON is valid
        # YAML, so jq's output is consumed as-is with every value quoted
        # correctly. The file REPLACES the job's environment on every
        # deploy, so a variable removed from the Environment is removed
        # from the job rather than lingering.
        #
        # This is the same per-client environment deploy-client.yml's
        # `build` step consumes: the publisher is orthogonal to per-client
        # subdomains, and EVENT_PUBLIC_URL and friends reach the job as
        # ordinary per-client env.
        env:
          EVENT_SLUG: ${{ vars.EVENT_SLUG }}
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
          EVENT_FIREBASE_REGION: ${{ vars.EVENT_FIREBASE_REGION }}
          EVENT_HOSTING_SITE: ${{ vars.EVENT_HOSTING_SITE }}
          EVENT_PUBLIC_URL: ${{ vars.EVENT_PUBLIC_URL }}
          EVENT_STORAGE_BUCKET: ${{ vars.EVENT_STORAGE_BUCKET }}
          EVENT_ALLOWED_ORIGINS: ${{ vars.EVENT_ALLOWED_ORIGINS }}
          EVENT_EMAIL_PROVIDER: ${{ vars.EVENT_EMAIL_PROVIDER }}
          EVENT_TICKETING_PROVIDER: ${{ vars.EVENT_TICKETING_PROVIDER }}
          EVENT_TICKETING_EVENT_ID: ${{ vars.EVENT_TICKETING_EVENT_ID }}
          EVENT_OPERATOR_NOTIFIER: ${{ vars.EVENT_OPERATOR_NOTIFIER }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
          VITE_ENABLE_CLIENT_ERROR_REPORTING: ${{ vars.VITE_ENABLE_CLIENT_ERROR_REPORTING }}
        run: |
          set -euo pipefail
          jq -n \
            --arg EVENT_SLUG "$EVENT_SLUG" \
            --arg EVENT_FIREBASE_PROJECT_ID "$EVENT_FIREBASE_PROJECT_ID" \
            --arg EVENT_FIREBASE_REGION "${EVENT_FIREBASE_REGION:-us-central1}" \
            --arg EVENT_HOSTING_SITE "$EVENT_HOSTING_SITE" \
            --arg EVENT_PUBLIC_URL "$EVENT_PUBLIC_URL" \
            --arg EVENT_STORAGE_BUCKET "$EVENT_STORAGE_BUCKET" \
            --arg EVENT_ALLOWED_ORIGINS "$EVENT_ALLOWED_ORIGINS" \
            --arg EVENT_EMAIL_PROVIDER "$EVENT_EMAIL_PROVIDER" \
            --arg EVENT_TICKETING_PROVIDER "$EVENT_TICKETING_PROVIDER" \
            --arg EVENT_TICKETING_EVENT_ID "$EVENT_TICKETING_EVENT_ID" \
            --arg EVENT_OPERATOR_NOTIFIER "$EVENT_OPERATOR_NOTIFIER" \
            --arg VITE_FIREBASE_API_KEY "$VITE_FIREBASE_API_KEY" \
            --arg VITE_FIREBASE_AUTH_DOMAIN "$VITE_FIREBASE_AUTH_DOMAIN" \
            --arg VITE_FIREBASE_PROJECT_ID "$VITE_FIREBASE_PROJECT_ID" \
            --arg VITE_FIREBASE_STORAGE_BUCKET "$VITE_FIREBASE_STORAGE_BUCKET" \
            --arg VITE_FIREBASE_MESSAGING_SENDER_ID "$VITE_FIREBASE_MESSAGING_SENDER_ID" \
            --arg VITE_FIREBASE_APP_ID "$VITE_FIREBASE_APP_ID" \
            --arg VITE_FIREBASE_MEASUREMENT_ID "$VITE_FIREBASE_MEASUREMENT_ID" \
            --arg VITE_FIREBASE_APP_CHECK_SITE_KEY "$VITE_FIREBASE_APP_CHECK_SITE_KEY" \
            --arg VITE_ENABLE_CLIENT_ERROR_REPORTING "$VITE_ENABLE_CLIENT_ERROR_REPORTING" \
            '{
              EVENT_SLUG: $EVENT_SLUG,
              EVENT_FIREBASE_PROJECT_ID: $EVENT_FIREBASE_PROJECT_ID,
              EVENT_FIREBASE_REGION: $EVENT_FIREBASE_REGION,
              EVENT_HOSTING_SITE: $EVENT_HOSTING_SITE,
              EVENT_PUBLIC_URL: $EVENT_PUBLIC_URL,
              EVENT_STORAGE_BUCKET: $EVENT_STORAGE_BUCKET,
              EVENT_ALLOWED_ORIGINS: $EVENT_ALLOWED_ORIGINS,
              EVENT_EMAIL_PROVIDER: $EVENT_EMAIL_PROVIDER,
              EVENT_TICKETING_PROVIDER: $EVENT_TICKETING_PROVIDER,
              EVENT_TICKETING_EVENT_ID: $EVENT_TICKETING_EVENT_ID,
              EVENT_OPERATOR_NOTIFIER: $EVENT_OPERATOR_NOTIFIER,
              VITE_FIREBASE_API_KEY: $VITE_FIREBASE_API_KEY,
              VITE_FIREBASE_AUTH_DOMAIN: $VITE_FIREBASE_AUTH_DOMAIN,
              VITE_FIREBASE_PROJECT_ID: $VITE_FIREBASE_PROJECT_ID,
              VITE_FIREBASE_STORAGE_BUCKET: $VITE_FIREBASE_STORAGE_BUCKET,
              VITE_FIREBASE_MESSAGING_SENDER_ID: $VITE_FIREBASE_MESSAGING_SENDER_ID,
              VITE_FIREBASE_APP_ID: $VITE_FIREBASE_APP_ID,
              VITE_FIREBASE_MEASUREMENT_ID: $VITE_FIREBASE_MEASUREMENT_ID,
              VITE_FIREBASE_APP_CHECK_SITE_KEY: $VITE_FIREBASE_APP_CHECK_SITE_KEY,
              VITE_ENABLE_CLIENT_ERROR_REPORTING: $VITE_ENABLE_CLIENT_ERROR_REPORTING,
              VITE_EVENT_PUBLIC_URL: $EVENT_PUBLIC_URL
            }' > "$RUNNER_TEMP/publisher-env.json"
          echo "wrote $(jq -r 'keys | length' "$RUNNER_TEMP/publisher-env.json") variables"
      - name: Create or update the Cloud Run job
        # `gcloud run jobs deploy` is create-or-update, so this is the same
        # command on a first provision and on every deploy after it.
        #
        # --service-account is the whole least-privilege story: the job runs
        # as an account scoped to this one project's Firestore, Storage, and
        # Hosting (docs/DEPLOY_RUNBOOK.md §9), never as the deploy identity
        # and never with a credential that can reach another client.
        #
        # --max-retries=0: publish-site.cjs is idempotent, but a retry that
        # silently succeeds would hide a flapping publish from the operator,
        # and cmsPublish already records the failure and alerts. An operator
        # re-runs deliberately.
        # --task-timeout=30m: generate + vite build + hosting deploy is
        # single-digit minutes; 30 leaves headroom without letting a wedged
        # execution sit past the 90-minute stranded-row sweep.
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
          EVENT_FIREBASE_REGION: ${{ vars.EVENT_FIREBASE_REGION }}
          EVENT_PUBLISHER_SERVICE_ACCOUNT: ${{ vars.EVENT_PUBLISHER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          region="${EVENT_FIREBASE_REGION:-us-central1}"
          gcloud run jobs deploy site-publisher \
            --image "$PUBLISHER_IMAGE" \
            --region "$region" \
            --project "$EVENT_FIREBASE_PROJECT_ID" \
            --service-account "$EVENT_PUBLISHER_SERVICE_ACCOUNT" \
            --env-vars-file "$RUNNER_TEMP/publisher-env.json" \
            --task-timeout=30m \
            --max-retries=0 \
            --parallelism=1 \
            --tasks=1 \
            --cpu=2 \
            --memory=4Gi
      - name: Grant the functions runtime service account run.invoker on the job
        # The narrowest grant that lets cmsPublish start this job: one role,
        # on this ONE job resource, for one identity — not project-level,
        # and not on every Cloud Run resource in the project. add-iam-policy-
        # binding is idempotent, so re-running a deploy is a no-op.
        #
        # The default is the project's default COMPUTE service account —
        # what Cloud Functions v2 runs as unless a function sets
        # `serviceAccount` (none in this repo do), and the same identity
        # docs/DEPLOY_RUNBOOK.md §3 binds secretAccessor to. It is derived
        # from the project number, not the project id, so it is looked up
        # rather than guessed. EVENT_FUNCTIONS_SERVICE_ACCOUNT overrides it
        # for a project that does pin a runtime account.
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
          EVENT_FIREBASE_REGION: ${{ vars.EVENT_FIREBASE_REGION }}
          EVENT_FUNCTIONS_SERVICE_ACCOUNT: ${{ vars.EVENT_FUNCTIONS_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          region="${EVENT_FIREBASE_REGION:-us-central1}"
          runtime_sa="${EVENT_FUNCTIONS_SERVICE_ACCOUNT:-}"
          if [ -z "$runtime_sa" ]; then
            project_number="$(gcloud projects describe "$EVENT_FIREBASE_PROJECT_ID" --format='value(projectNumber)')"
            runtime_sa="${project_number}-compute@developer.gserviceaccount.com"
          fi
          gcloud run jobs add-iam-policy-binding site-publisher \
            --region "$region" \
            --project "$EVENT_FIREBASE_PROJECT_ID" \
            --member "serviceAccount:${runtime_sa}" \
            --role roles/run.invoker
          echo "run.invoker granted to ${runtime_sa} on site-publisher"

  content:
    name: Generate content snapshot
    needs: [guard, shared, validate-env]
    # Skipped entirely on a bootstrap run (inputs.bootstrap: true) — the
    # very first dispatch against a fresh project has no config/event doc
    # yet (readDeployment throws "run scripts/init-event.cjs first"), and
    # provisioning the project is exactly what a bootstrap run is for. See
    # docs/DEPLOY_RUNBOOK.md §5: bootstrap dispatch → operator runs
    # scripts/init-event.cjs → a normal (non-bootstrap) dispatch or push
    # deploys content/hosting. `build`, `hosting`, and `smoke` all
    # transitively skip when this does, via their own needs.
    if: inputs.bootstrap != true
    environment: ${{ inputs.client }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-tgz-${{ inputs.client }}
          path: functions/vendor
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Generate the content snapshot out of tree
        # --out writes to $RUNNER_TEMP, never into apps/web/src/generated
        # (spec §8.6) — the committed synthetic snapshot is untouched by
        # every deploy.
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
          EVENT_STORAGE_BUCKET: ${{ vars.EVENT_STORAGE_BUCKET }}
        run: node scripts/generate-content.cjs --out "$RUNNER_TEMP/generated"
      - uses: actions/upload-artifact@v4
        with:
          name: generated-content-${{ inputs.client }}
          path: ${{ runner.temp }}/generated
          retention-days: 1

  build:
    name: Build web app
    needs: content
    environment: ${{ inputs.client }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-tgz-${{ inputs.client }}
          path: functions/vendor
      - uses: actions/download-artifact@v4
        with:
          name: generated-content-${{ inputs.client }}
          path: ${{ runner.temp }}/generated
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build the web app against the generated snapshot
        env:
          GENERATED_DIR: ${{ runner.temp }}/generated
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          # AuthContext.jsx builds the functions origin from
          # VITE_FIREBASE_PROJECT_ID + VITE_FIREBASE_REGION (default
          # us-central1 when unset) — a client whose functions run outside
          # us-central1 needs this set, or the built bundle calls a region
          # with nothing deployed to it.
          VITE_FIREBASE_REGION: ${{ vars.EVENT_FIREBASE_REGION }}
          # App Check site key (§3.1). Unset → firebase.js never loads the
          # App Check SDK and the bundle behaves exactly as before; it must
          # be set here before EVENT_APP_CHECK_ENFORCED is turned on, or
          # every sign-in request is refused as unattested.
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
          VITE_ENABLE_CLIENT_ERROR_REPORTING: ${{ vars.VITE_ENABLE_CLIENT_ERROR_REPORTING }}
          VITE_EVENT_PUBLIC_URL: ${{ vars.EVENT_PUBLIC_URL }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ inputs.client }}
          path: apps/web/dist
          retention-days: 1

  hosting:
    name: Deploy hosting
    needs: [guard, provision, functions, build]
    # `functions` is skipped (not failed) on a push run the paths filter
    # excludes, and `build` is skipped on a bootstrap run (see the
    # `content` job) — `always()` plus the explicit result checks let
    # hosting proceed only when nothing it depends on actually failed.
    if: |
      always() &&
      needs.guard.result == 'success' &&
      needs.provision.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.functions.result == 'success' || needs.functions.result == 'skipped')
    environment: ${{ inputs.client }}
    runs-on: ubuntu-latest
    outputs:
      public-url: ${{ vars.EVENT_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ inputs.client }}
          path: apps/web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Map the hosting target for this project
        # firebase.json's "hosting" block names a target ("site") rather
        # than a literal site id, because this one committed file deploys
        # many different client projects — target:apply writes an
        # ephemeral .firebaserc for this run only, scoping the target to
        # THIS project's EVENT_HOSTING_SITE. Without it, `firebase.json`
        # has no site/target mapping at all and the deploy below fails.
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
          EVENT_HOSTING_SITE: ${{ vars.EVENT_HOSTING_SITE }}
        run: >-
          npx firebase target:apply hosting site "$EVENT_HOSTING_SITE"
          --project "$EVENT_FIREBASE_PROJECT_ID"
      - name: Set the updatesMeta rewrite region for this project
        # firebase.json's /updates/** rewrite names a function region
        # (object-form "function": { functionId, region }, not the bare
        # string form — the string form silently defaults to us-central1,
        # which routes every non-default-region client's /updates/** at a
        # backend that does not exist there). Region is per-client env
        # (EVENT_FIREBASE_REGION), while firebase.json is one file shared by
        # every client's deploy — same shape of problem as the hosting
        # target above, same fix: patch the WORKING COPY in place for this
        # run only, right before the deploy step reads it. Never committed.
        env:
          EVENT_FIREBASE_REGION: ${{ vars.EVENT_FIREBASE_REGION }}
        run: |
          set -euo pipefail
          region="${EVENT_FIREBASE_REGION:-us-central1}"
          jq --arg region "$region" '
            .hosting.rewrites |= map(
              if (.function | type) == "object" and .function.functionId == "updatesMeta"
              then .function.region = $region
              else . end
            )
          ' firebase.json > firebase.json.tmp
          mv firebase.json.tmp firebase.json
          echo "updatesMeta rewrite region set to: $region"
      - name: Deploy hosting
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
        run: >-
          npx firebase deploy
          --only hosting:site
          --project "$EVENT_FIREBASE_PROJECT_ID"
          --non-interactive

  post:
    name: Refresh updatesMeta after hosting (self-fetch template ordering)
    # updatesMeta (functions/src/public/og.cjs) self-fetches the deployed
    # hosting index.html as its SSR template and caches it per container
    # (spec §9 "Updates + SSR OG", issue #27). A container that cold-started
    # — and so cached its template — BEFORE this run's hosting deploy went
    # out would keep serving crawlers the PREVIOUS build's asset references
    # for the rest of its cache TTL. Redeploying just this one function here
    # forces a fresh cold start, which fetches the just-published template
    # immediately, rather than waiting on natural container recycling.
    # Unconditional on `hosting` succeeding — hosting always changes the
    # template on every run, whether or not `functions/**` did.
    needs: [guard, hosting]
    if: always() && needs.guard.result == 'success' && needs.hosting.result == 'success'
    environment: ${{ inputs.client }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-tgz-${{ inputs.client }}
          path: functions/vendor
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Write the functions runtime env for this project
        # Same shape as the `functions` job's env file (spec §2.1 Tier A) —
        # `firebase deploy --only functions:updatesMeta` still bakes
        # `functions/.env.<project-id>` at deploy time even for a
        # single-function deploy.
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
          EVENT_SLUG: ${{ vars.EVENT_SLUG }}
          EVENT_FIREBASE_REGION: ${{ vars.EVENT_FIREBASE_REGION }}
          EVENT_PUBLIC_URL: ${{ vars.EVENT_PUBLIC_URL }}
          EVENT_STORAGE_BUCKET: ${{ vars.EVENT_STORAGE_BUCKET }}
          EVENT_ALLOWED_ORIGINS: ${{ vars.EVENT_ALLOWED_ORIGINS }}
          EVENT_EMAIL_PROVIDER: ${{ vars.EVENT_EMAIL_PROVIDER }}
          EVENT_TICKETING_PROVIDER: ${{ vars.EVENT_TICKETING_PROVIDER }}
          EVENT_TICKETING_EVENT_ID: ${{ vars.EVENT_TICKETING_EVENT_ID }}
          EVENT_OPERATOR_NOTIFIER: ${{ vars.EVENT_OPERATOR_NOTIFIER }}
          EVENT_APP_CHECK_ENFORCED: ${{ vars.EVENT_APP_CHECK_ENFORCED }}
          EVENT_OTP_SEND_CEILING_PER_HOUR: ${{ vars.EVENT_OTP_SEND_CEILING_PER_HOUR }}
          EVENT_SITE_PUBLISHER_ENABLED: ${{ vars.EVENT_SITE_PUBLISHER_ENABLED }}
        run: |
          set -euo pipefail
          {
            echo "EVENT_FIREBASE_PROJECT_ID=$EVENT_FIREBASE_PROJECT_ID"
            echo "EVENT_SLUG=$EVENT_SLUG"
            echo "EVENT_FIREBASE_REGION=${EVENT_FIREBASE_REGION:-us-central1}"
            echo "EVENT_PUBLIC_URL=$EVENT_PUBLIC_URL"
            echo "EVENT_STORAGE_BUCKET=$EVENT_STORAGE_BUCKET"
            echo "EVENT_ALLOWED_ORIGINS=$EVENT_ALLOWED_ORIGINS"
            echo "EVENT_EMAIL_PROVIDER=$EVENT_EMAIL_PROVIDER"
            echo "EVENT_TICKETING_PROVIDER=$EVENT_TICKETING_PROVIDER"
            echo "EVENT_TICKETING_EVENT_ID=$EVENT_TICKETING_EVENT_ID"
            echo "EVENT_OPERATOR_NOTIFIER=$EVENT_OPERATOR_NOTIFIER"
            echo "EVENT_APP_CHECK_ENFORCED=${EVENT_APP_CHECK_ENFORCED:-false}"
            echo "EVENT_OTP_SEND_CEILING_PER_HOUR=${EVENT_OTP_SEND_CEILING_PER_HOUR:-500}"
            # Presence-of-config gate for the site publisher (spec §8.4):
            # cms/publisher.cjs treats an unset EVENT_SITE_PUBLISHER_JOB as
            # "this deployment has no publisher" and skips cleanly. The key
            # is written ONLY for a client whose publisher job this workflow
            # actually creates, so a client without one never invokes a job
            # that does not exist. The value is the fixed job name — see
            # SITE_PUBLISHER_JOB_NAME in packages/shared/src/config/deploy.cjs
            # and the `publisher` job below.
            if [ "${EVENT_SITE_PUBLISHER_ENABLED:-false}" = "true" ]; then
              echo "EVENT_SITE_PUBLISHER_JOB=site-publisher"
            fi
          } > "functions/.env.${EVENT_FIREBASE_PROJECT_ID}"
      - name: Redeploy updatesMeta only
        env:
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
        run: >-
          npx firebase deploy
          --only functions:updatesMeta
          --project "$EVENT_FIREBASE_PROJECT_ID"
          --non-interactive

  smoke:
    name: Post-deploy smoke test
    needs: post
    environment: ${{ inputs.client }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: OPTIONS-preflight every reviewed endpoint and GET the public site
        env:
          EVENT_FIREBASE_REGION: ${{ vars.EVENT_FIREBASE_REGION }}
          EVENT_FIREBASE_PROJECT_ID: ${{ vars.EVENT_FIREBASE_PROJECT_ID }}
          EVENT_PUBLIC_URL: ${{ vars.EVENT_PUBLIC_URL }}
        run: >-
          node scripts/smoke-test.cjs
          --region "${EVENT_FIREBASE_REGION:-us-central1}"
          --project-id "$EVENT_FIREBASE_PROJECT_ID"
          --public-url "$EVENT_PUBLIC_URL"
