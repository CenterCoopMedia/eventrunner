name: CI

# Credential-free by design (spec §8.1): no secrets, no Firebase project.
# Every job must be runnable from a fork PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  unit:
    name: Shared package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  unit-web:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Run web unit tests
        run: npm run test:web

  build:
    name: Web build
    runs-on: ubuntu-latest
    # Credential-free (spec §8.1): the committed synthetic snapshot in
    # apps/web/src/generated/ feeds the build, and VITE_FIREBASE_* values are
    # non-secret client config — CI uses inline dummies so fork PRs build.
    env:
      VITE_FIREBASE_API_KEY: ci-dummy-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-dummy
      VITE_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Build the web app from the committed snapshot
        run: npm run build
      - name: Assert dist exists
        run: test -f apps/web/dist/index.html

  hygiene:
    name: Generated-content hygiene
    runs-on: ubuntu-latest
    # Regenerates apps/web/src/generated/* from the synthetic demo fixture
    # (spec §8.6) and fails on any byte-for-byte difference, so the
    # committed snapshot cannot drift or be overwritten with anything other
    # than demo data. No credentials — this reads scripts/lib/demo-event.cjs,
    # never a real project, so it runs on fork PRs too.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Check the committed snapshot against the demo fixture
        run: node scripts/generate-content.cjs --demo --check

  rules:
    name: Security rules on emulators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Run rules tests
        run: npm run test:rules

  e2e:
    name: E2E on emulators
    runs-on: ubuntu-latest
    # Credential-free (spec §8.1, issue #38): Playwright drives the real app
    # against the full emulator suite (auth, firestore, storage, functions)
    # with the console email provider and manual ticketing — no secrets, no
    # live project, so this runs the same on a fork PR as every other job.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        env:
          # Installed explicitly below, cached on its own key — skip the
          # postinstall fetch here so a `npm ci` cache hit never re-downloads
          # a browser binary npm never asked for.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
