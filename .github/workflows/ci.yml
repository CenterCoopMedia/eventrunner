name: CI

# Credential-free by design (spec §8.1): no secrets, no Firebase project.
# Every job must be runnable from a fork PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    # Credential-free (spec §8.1, §1.5): reads only the checked-out git
    # range from the PR event payload — no token, no third-party action, so
    # a fork PR runs it exactly like a same-repo PR. Skipped on push (a
    # merge to main has already passed this check as a PR).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every commit is signed off
        run: node scripts/check-dco.cjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  unit:
    name: Shared package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  unit-web:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Run web unit tests
        run: npm run test:web

  build:
    name: Web build
    runs-on: ubuntu-latest
    # Credential-free (spec §8.1): the committed synthetic snapshot in
    # apps/web/src/generated/ feeds the build, and VITE_FIREBASE_* values are
    # non-secret client config — CI uses inline dummies so fork PRs build.
    env:
      VITE_FIREBASE_API_KEY: ci-dummy-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-dummy
      VITE_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Build the web app from the committed snapshot
        run: npm run build
      - name: Assert dist exists
        run: test -f apps/web/dist/index.html

  hygiene:
    name: Generated-content hygiene
    runs-on: ubuntu-latest
    # Regenerates apps/web/src/generated/* from the synthetic demo fixture
    # (spec §8.6) and fails on any byte-for-byte difference, so the
    # committed snapshot cannot drift or be overwritten with anything other
    # than demo data. No credentials — this reads scripts/lib/demo-event.cjs,
    # never a real project, so it runs on fork PRs too.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Check the committed snapshot against the demo fixture
        run: node scripts/generate-content.cjs --demo --check

  rules:
    name: Security rules on emulators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Run rules tests
        run: npm run test:rules
