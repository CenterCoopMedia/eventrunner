name: 404 demo evidence

# Review helper for the 404 branch. It builds an artifact only: no deploy,
# secrets, write token, automatic commit or alteration of required CI checks.
on:
  pull_request:
    paths:
      - 'apps/web/src/pages/NotFound.*'
      - '.github/workflows/404-demo-evidence.yml'

permissions:
  contents: read

concurrency:
  group: 404-demo-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pack shared into functions vendor
        run: npm run prepare:functions
      - name: Install locked dependencies
        run: npm ci
      - name: Generate the demo from this exact source tree
        run: |
          node scripts/build-demo.cjs
          git rev-parse HEAD > 404-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 404-demo-bundle
          retention-days: 2
          if-no-files-found: error
          path: |
            docs/demo/
            404-source-sha.txt
