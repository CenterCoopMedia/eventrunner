name: No AI attribution

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

concurrency:
  group: attribution-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id || github.event.review.id || 'metadata' }}
  cancel-in-progress: true

permissions: {}

jobs:
  clean:
    name: Remove attribution
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # No actor filter: includes humans and bots. GITHUB_TOKEN edits do not
    # trigger another run; the cleaner also makes no edit when text is clean.
    # Fork review events have a read-only token; see AGENTS.md for that limit.
    steps:
      - name: Clean current text using trusted default-branch code
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // No checkout, PR code, artifacts, shell, or interpolated user text.
            // Resolve and pin the default branch; review-event context.sha can
            // refer to an untrusted PR merge, so it must never supply the code.
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: context.payload.repository.default_branch,
            });
            const { data: source } = await github.rest.repos.getContent({
              ...context.repo,
              path: 'scripts/ci/no-ai-attribution.cjs',
              ref: branch.commit.sha,
            });
            if (source.type !== 'file' || source.encoding !== 'base64') {
              throw new Error('Trusted attribution cleaner is not a file.');
            }
            const fs = require('node:fs');
            const path = require('node:path');
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'attribution-'));
            const file = path.join(directory, 'clean.cjs');
            try {
              fs.writeFileSync(file, Buffer.from(source.content, 'base64'));
              await require(file).run({ github, context, core });
            } finally {
              fs.rmSync(directory, { recursive: true, force: true });
            }
