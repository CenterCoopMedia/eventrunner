name: Workspace snapshot

"on":
  push:
    branches:
      - codex/workspace-snapshot-20260828

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/workspace-snapshot-20260828
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the workspace
        run: |
          npm run prepare:functions
          npm ci

      - name: Pack source, git metadata, and installed dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar --zstd -cf /tmp/eventrunner-workspace.tar.zst .

      - name: Upload the workspace
        uses: actions/upload-artifact@v4
        with:
          name: eventrunner-workspace-20260828
          path: /tmp/eventrunner-workspace.tar.zst
          compression-level: 0
          retention-days: 1
