name: Repair PR 485 demo

on:
  push:
    branches: [codex/483-ticket-operations]
    paths: [.github/workflows/repair-485-demo.yml]

permissions:
  contents: read

concurrency:
  group: repair-485-demo
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'CenterCoopMedia/eventrunner'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild and verify without repository write access
        run: |
          set -euo pipefail
          npm run prepare:functions
          npm ci
          node --test scripts/build-demo.test.cjs
          npm run build:demo
          node scripts/build-demo.cjs --check
          node scripts/ci/bundle-budget.cjs --dist docs/demo
          git diff --check
          git diff --exit-code -- . ':!docs/demo/**'
          git add -A -- docs/demo
          node <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const paths = execFileSync('git', ['diff', '--cached', '--name-only', '--no-renames', '-z', '--', 'docs/demo'], {encoding:'utf8'}).split('\0').filter(Boolean);
          const entries = paths.map(path => {
            if (!path.startsWith('docs/demo/') || path.split('/').includes('..')) throw new Error('Unexpected generated path');
            if (!fs.existsSync(path)) return {path, deleted:true};
            if (!fs.lstatSync(path).isFile()) throw new Error('Generated path is not a regular file');
            return {path, content:fs.readFileSync(path).toString('base64')};
          });
          fs.writeFileSync('demo-repair.json', JSON.stringify({source:process.env.GITHUB_SHA, entries}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: demo-repair-${{ github.sha }}
          path: demo-repair.json
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: demo-repair-${{ github.sha }}
      - name: Publish only verified generated files to the unchanged PR branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('demo-repair.json', 'utf8'));
            if (context.repo.owner !== 'CenterCoopMedia' || context.repo.repo !== 'eventrunner' || context.ref !== 'refs/heads/codex/483-ticket-operations') throw new Error('Wrong repair scope');
            if (manifest.source !== context.sha || !Array.isArray(manifest.entries) || manifest.entries.length > 500) throw new Error('Invalid repair manifest');
            const ref = 'heads/codex/483-ticket-operations';
            const current = await github.rest.git.getRef({...context.repo, ref});
            if (current.data.object.sha !== context.sha) throw new Error('Branch moved; leave it unchanged');
            const parent = await github.rest.git.getCommit({...context.repo, commit_sha:context.sha});
            const entries = [];
            for (const file of manifest.entries) {
              if (typeof file.path !== 'string' || !file.path.startsWith('docs/demo/') || file.path.split('/').includes('..')) throw new Error('Out-of-scope repair path');
              if (file.deleted === true) {
                entries.push({path:file.path, mode:'100644', type:'blob', sha:null});
              } else {
                if (typeof file.content !== 'string' || file.content.length > 8000000) throw new Error('Invalid generated file');
                const blob = await github.rest.git.createBlob({...context.repo, content:file.content, encoding:'base64'});
                entries.push({path:file.path, mode:'100644', type:'blob', sha:blob.data.sha});
              }
            }
            entries.push({path:'.github/workflows/repair-485-demo.yml', mode:'100644', type:'blob', sha:null});
            const tree = await github.rest.git.createTree({...context.repo, base_tree:parent.data.tree.sha, tree:entries});
            const commit = await github.rest.git.createCommit({...context.repo, tree:tree.data.sha, parents:[context.sha], message:'fix(ci): regenerate the ticket operations demo\n\nNode 22 clean-lockfile install, 18 demo generator tests, fresh-build comparison and unchanged demo bundle budgets passed. Removes the one-shot repair workflow.\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>', author:{name:'github-actions[bot]', email:'41898282+github-actions[bot]@users.noreply.github.com'}});
            const latest = await github.rest.git.getRef({...context.repo, ref});
            if (latest.data.object.sha !== context.sha) throw new Error('Branch moved; leave it unchanged');
            await github.rest.git.updateRef({...context.repo, ref, sha:commit.data.sha, force:false});
            core.notice('Verified demo published at ' + commit.data.sha);
