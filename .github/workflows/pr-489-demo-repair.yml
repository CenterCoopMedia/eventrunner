name: PR 489 isolated demo repair

on:
  push:
    branches: [codex/489-demo-repair-8132b90]
    paths: [.github/workflows/pr-489-demo-repair.yml]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'CenterCoopMedia/eventrunner'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8132b909604f51de952ead4d6107c632045abf2a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run prepare:functions
      - run: npm ci
      - name: Verify the source regressions
        run: npm run test -w apps/web -- src/pages/NotFound.test.jsx src/pages/ContentPage.test.jsx
      - name: Generate and verify the exact demo
        run: |
          set -euo pipefail
          node scripts/generate-content.cjs --demo
          node scripts/generate-content.cjs --demo --check
          git diff --exit-code -- apps/web/src/generated
          node scripts/build-demo.cjs
          node scripts/build-demo.cjs --check
          node scripts/ci/bundle-budget.cjs --dist docs/demo
      - name: Package a generated-output-only commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8132b909604f51de952ead4d6107c632045abf2a
          git add -- docs/demo
          git -c user.name='Joe Amditis' -c user.email='6799804+jamditis@users.noreply.github.com' commit -s -m 'build: regenerate the 404 demo with the locked CI toolchain'
          test "$(git rev-parse HEAD^)" = 8132b909604f51de952ead4d6107c632045abf2a
          mkdir -p "$RUNNER_TEMP/489-demo-repair"
          git bundle create "$RUNNER_TEMP/489-demo-repair/generated.bundle" HEAD ^8132b909604f51de952ead4d6107c632045abf2a
          git rev-parse HEAD > "$RUNNER_TEMP/489-demo-repair/head.sha"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/489-demo-repair/tree.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-489-generated-commit
          path: ${{ runner.temp }}/489-demo-repair/
          if-no-files-found: error
          retention-days: 2

  publish-candidate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8132b909604f51de952ead4d6107c632045abf2a
      - uses: actions/download-artifact@v4
        with:
          name: pr-489-generated-commit
          path: ${{ runner.temp }}/489-demo-repair
      - name: Verify and publish the isolated candidate
        run: |
          set -euo pipefail
          git bundle verify "$RUNNER_TEMP/489-demo-repair/generated.bundle"
          git -c core.hooksPath=/dev/null fetch --no-tags "$RUNNER_TEMP/489-demo-repair/generated.bundle" HEAD
          candidate="$(git rev-parse FETCH_HEAD)"
          test "$candidate" = "$(cat "$RUNNER_TEMP/489-demo-repair/head.sha")"
          test "$(git rev-parse "$candidate^")" = 8132b909604f51de952ead4d6107c632045abf2a
          test "$(git rev-parse "$candidate^{tree}")" = "$(cat "$RUNNER_TEMP/489-demo-repair/tree.sha")"
          test "$(git rev-list --count 8132b909604f51de952ead4d6107c632045abf2a.."$candidate")" = 1
          CANDIDATE="$candidate" python3 - <<'PY'
          import os, subprocess
          base = '8132b909604f51de952ead4d6107c632045abf2a'
          head = os.environ['CANDIDATE']
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--no-renames', '-z', base, head]).split(b'\0')
          paths = [p for p in paths if p]
          assert paths and all(p.startswith(b'docs/demo/') for p in paths), 'Refusing non-demo changes'
          entries = subprocess.check_output(['git', 'ls-tree', '-r', '-z', head, '--', 'docs/demo']).split(b'\0')
          assert all(not e or e.startswith(b'100644 blob ') for e in entries), 'Only regular demo files may be published'
          print(f'Verified {len(paths)} generated paths; no application or workflow edits.')
          PY
          # Publish only a candidate branch. The connected review workflow
          # verifies it and advances the PR with a compare-and-swap lease.
          git -c core.hooksPath=/dev/null push origin "$candidate:refs/heads/codex/489-generated-demo-8132b90"
          printf 'Candidate commit: `%s`\n\nGenerated tree: `%s`\n' "$candidate" "$(git rev-parse "$candidate^{tree}")" >> "$GITHUB_STEP_SUMMARY"
