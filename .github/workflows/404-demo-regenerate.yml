name: 404 demo regenerate
on:
  pull_request:
    paths:
      - .github/workflows/404-demo-regenerate.yml
permissions:
  contents: read
concurrency:
  group: 404-demo-regenerate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.pull_request.number == 489 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/404-ticket-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run prepare:functions && npm ci --ignore-scripts
      - run: npm run build:demo && node scripts/build-demo.cjs --check
      - name: Collect only generated differences
        run: |
          git add -- docs/demo
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const root = '/tmp/404-demo';
          const names = git('diff', '--cached', '--name-only', '--no-renames', '--', 'docs/demo').split('\n').filter(Boolean);
          const changes = names.map(name => {
            if (!name.startsWith('docs/demo/') || name.split('/').includes('..')) throw new Error('Invalid generated path');
            const deleted = !fs.existsSync(name);
            if (!deleted) {
              const target = path.join(root, 'files', name);
              fs.mkdirSync(path.dirname(target), { recursive: true });
              fs.copyFileSync(name, target);
            }
            return { path: name, deleted };
          });
          fs.mkdirSync(root, { recursive: true });
          fs.writeFileSync(path.join(root, 'manifest.json'), JSON.stringify({ sourceSha: git('rev-parse', 'HEAD'), changes }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: 404-generated-data
          path: /tmp/404-demo/
          retention-days: 1
  store:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout, package installation, shell commands, or execution of
      # generated/PR code in this job. Artifacts are bounded data only.
      - uses: actions/download-artifact@v4
        with:
          name: 404-generated-data
          path: generated-input
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const root = path.resolve('generated-input');
            const raw = fs.readFileSync(path.join(root, 'manifest.json'), 'utf8');
            if (Buffer.byteLength(raw) > 100000) throw new Error('Manifest exceeds limit');
            const manifest = JSON.parse(raw);
            const sourceSha = context.payload.pull_request.head.sha;
            if (manifest.sourceSha !== sourceSha || !Array.isArray(manifest.changes) || manifest.changes.length > 500) throw new Error('Invalid manifest identity');
            const seen = new Set();
            const entries = [];
            let size = 0;
            for (const entry of manifest.changes) {
              const name = entry.path;
              if (typeof name !== 'string' || !/^docs\/demo\/[A-Za-z0-9_./-]+$/.test(name) || name.split('/').some(part => !part || part === '.' || part === '..') || seen.has(name) || typeof entry.deleted !== 'boolean') throw new Error('Invalid generated entry');
              seen.add(name);
              if (entry.deleted) { entries.push({ path: name, mode: '100644', type: 'blob', sha: null }); continue; }
              const file = path.join(root, 'files', name);
              if (!fs.realpathSync(file).startsWith(root + path.sep) || !fs.lstatSync(file).isFile()) throw new Error('Non-regular generated file');
              const stat = fs.statSync(file);
              size += stat.size;
              if (stat.size > 10000000 || size > 20000000) throw new Error('Generated bytes exceed limit');
              const { data } = await github.rest.git.createBlob({ ...context.repo, encoding: 'base64', content: fs.readFileSync(file).toString('base64') });
              entries.push({ path: name, mode: '100644', type: 'blob', sha: data.sha });
            }
            const { data: source } = await github.rest.git.getCommit({ ...context.repo, commit_sha: sourceSha });
            entries.push({ path: '.github/workflows/404-demo-regenerate.yml', mode: '100644', type: 'blob', sha: null });
            const { data: tree } = await github.rest.git.createTree({ ...context.repo, base_tree: source.tree.sha, tree: entries });
            fs.mkdirSync('review-result');
            fs.writeFileSync('review-result/generated-tree.json', JSON.stringify({ sourceSha, treeSha: tree.sha, files: manifest.changes.length }, null, 2));
            // The connected Git client reviews this result and moves the ref;
            // this workflow never commits, pushes, or deploys.
      - uses: actions/upload-artifact@v4
        with:
          name: 404-generated-tree
          path: review-result/
          retention-days: 1
