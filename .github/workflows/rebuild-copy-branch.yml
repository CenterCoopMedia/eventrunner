name: Apply copy edits and rebuild outputs

on:
  push:
    branches:
      - agent/plain-language-copy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/plain-language-copy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply source copy edits
        run: node scripts/dev/apply-copy-edits.cjs
      - name: Pack shared package for Functions
        run: npm run prepare:functions
      - name: Install dependencies
        run: npm ci
      - name: Rebuild preset catalog
        run: node scripts/build-preset-catalog.cjs
      - name: Rebuild synthetic content snapshot
        run: node scripts/generate-content.cjs --demo
      - name: Rebuild documentation pages
        run: node scripts/build-pages.cjs
      - name: Rebuild static demo
        run: node scripts/build-demo.cjs
      - name: Commit source and generated copy
        run: |
          if git diff --quiet; then
            echo 'Copy sources and generated outputs are current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/lib/demo-event.cjs scripts/build-preset-catalog.cjs \
            packages/shared/src/presetCatalog.cjs apps/web/src/admin/presetCopy.js \
            design/tokens/presets/README.md apps/web/src/generated docs/docs docs/demo
          git commit -s -m 'chore(copy): rebuild user-facing outputs'
          git push origin HEAD:agent/plain-language-copy
