<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Event Runner">
  <!-- The Event Runner mark: a stem, and the three rule weights the design
       system ships — nameplate, hairline, strong. It is the same four strokes
       the masthead draws inline; here they carry ink, because a favicon has
       no page color to inherit. -->
  <style>
    rect { fill: #16181d }
    @media (prefers-color-scheme: dark) { rect { fill: #e8ebf0 } }
  </style>
  <rect x="2.5" y="2" width="3" height="20"/>
  <rect x="5.5" y="2" width="16" height="3"/>
  <rect x="5.5" y="11" width="9.5" height="2"/>
  <rect x="5.5" y="19.5" width="13" height="2.5"/>
</svg>
