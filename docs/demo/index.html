<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="https://centercoopmedia.github.io/eventrunner/demo/branding/nclocal-favicon.svg" />
    <!-- apps/web/public/manifest.webmanifest ships a neutral fallback so
         this resolves under a non-root base (Vite rewrites a root-relative
         href against `base` for any file it finds in publicDir, same as
         the favicon above) and so a hand deploy that never runs
         scripts/publish-site.cjs serves real JSON here rather than the
         SPA shell (Firebase Hosting serves a matching static file before
         it falls through to the `**` rewrite). The publisher overwrites
         this file with the event's own manifest at publish time
         (scripts/lib/site-manifest.cjs, M7 issue 5). -->
    <link rel="manifest" href="/eventrunner/demo/manifest.webmanifest" />
    <!-- Event-neutral shell title; EventConfigProvider sets document.title
         from the generated snapshot before first paint (spec §2.4). The SEO
         pass (M2, later tranche) owns the OG/meta tags. -->
    <title>NC News &amp; Information Summit · Past-event demo</title>
    <script type="module" crossorigin src="/eventrunner/demo/assets/index-DqHd5BPF.js"></script>
    <link rel="stylesheet" crossorigin href="/eventrunner/demo/assets/index-BLGk1pDp.css">
      <meta name="description" content="Past-event demo of the 2026 NC News &amp; Information Summit in Raleigh: Selected historical sessions, speakers and documented partners." />
    <meta property="og:title" content="NC News &amp; Information Summit · Past-event demo" />
    <meta property="og:description" content="Past-event demo of the 2026 NC News &amp; Information Summit in Raleigh: Selected historical sessions, speakers and documented partners." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://centercoopmedia.github.io/eventrunner/demo" />
    <meta property="og:image" content="https://centercoopmedia.github.io/eventrunner/demo/branding/nclocal-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NC News &amp; Information Summit · Past-event demo" />
    <meta name="twitter:description" content="Past-event demo of the 2026 NC News &amp; Information Summit in Raleigh: Selected historical sessions, speakers and documented partners." />
    <meta name="twitter:image" content="https://centercoopmedia.github.io/eventrunner/demo/branding/nclocal-og.png" />
  </head>
  <body>

  </body>
</html>
